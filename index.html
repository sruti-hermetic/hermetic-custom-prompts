================================================================= */
/* The skill text lives in a text/plain block in the body rather than in a
   template literal here. It is reproduced verbatim from the hermetic-venue-config
   skill, and a template literal would mean escaping every backtick and every
   ${ in it -- which is exactly how a copy drifts from its original. As plain
   text it can be diffed against the skill file line for line. */
const SKILL_TEXT = (document.getElementById('skillText') || { textContent:'' }).textContent.trim();

/* =================================================================
   STORAGE: Google Sheet sync (via Apps Script web app) over a
   localStorage mirror

   Every shared key lives in localStorage as well as in the Sheet.
   Reads come out of that mirror, so the first paint never waits on a
   network round trip, and edits are written locally before they are
   sent -- a specialist mid-call never types into a form that is
   blocked on a round trip.

   The Sheet is reached through an Apps Script web app, where each
   /exec call costs roughly a second and same-user calls are executed
   one at a time. Everything below is shaped by that: one batched
   getAll per pull rather than a call per key, deltas by `since` once
   the first pull has landed, and writes coalesced per key.

   Several specialists use this at once, each on a live call, so the
   layer underneath is built to converge rather than to take turns.
   See RECORDS for how that works.
================================================================= */
const KV_PREFIX = 'hermetic:';
/* Never leaves this browser. The sync URL is per-deployment; the client id and
   display name are how this browser introduces itself to everyone else. */
const KV_LOCAL_ONLY = new Set([
  'hermetic:syncUrl', 'hermetic:clientId', 'hermetic:displayName', 'hermetic:dirtyKeys'
]);

let syncUrl = localStorage.getItem('hermetic:syncUrl') || '';
let kvHydrated = false;          // the mirror has been reconciled with the Sheet
let kvHydrating = null;          // single-flight first pull
let serverVersion = 0;           // 0 until a getAll answers; < 3 has no ifRev guard
let lastPullAt = 0;              // server clock as of the last successful pull

/* This browser's identity. The id is stable so presence rows do not multiply
   every reload; the name is what teammates actually see. */
const CLIENT_ID = (function(){
  let v = localStorage.getItem('hermetic:clientId');
  if (!v){
    v = 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
    localStorage.setItem('hermetic:clientId', v);
  }
  return v;
})();
let displayName = localStorage.getItem('hermetic:displayName') || '';

function localRead(key){
  const raw = localStorage.getItem(key);
  if (raw === null) return null;
  try{ return JSON.parse(raw); }
  catch(e){ console.warn('Unreadable local value for', key, e); return null; }
}
function localWrite(key, value){
  try{ localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); }
  catch(e){ console.warn('Could not mirror', key, 'locally:', e); }
}
function localKeys(prefix){
  const out = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k || !k.startsWith(prefix || KV_PREFIX)) continue;
    if (KV_LOCAL_ONLY.has(k)) continue;
    out.push(k);
  }
  return out;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =================================================================
   RECORDS

   Everything shared lives in its own row: one per account
   (hermetic:account:<id>), one per venue
   (hermetic:venue:<accountId>:<venueId>), one per venue's version
   history, one for settings. Nothing is stored as a list, so two
   people adding accounts at the same time cannot overwrite each
   other's -- there is no shared list to rewrite. The sidebar is
   derived from whichever account rows exist.

   Within a record, every field carries its own timestamp in fieldTs.
   A merge is per field, so one specialist typing into "Pricing" and
   another into "Policies" on the same venue both keep their work.
   Ties break on the writer's client id, so every browser resolves an
   exact tie the same way and the mirrors converge.

   Deletes are tombstones (deleted: true). A removed row could not
   propagate -- the Sheet has no delete, and a reader could not tell a
   deletion from a row it had simply never seen.
================================================================= */
const RECORD_KINDS = {
  account:  { prefix: 'hermetic:account:',  scalars: ['name', 'drive_link', 'deleted'] },
  venue:    { prefix: 'hermetic:venue:',    scalars: ['name', 'deleted'] },
  presence: { prefix: 'hermetic:presence:' },
  settings: { prefix: 'hermetic:settings'   }
};

function kindOfKey(key){
  if (key === 'hermetic:settings') return 'settings';
  for (const [kind, def] of Object.entries(RECORD_KINDS)){
    if (kind !== 'settings' && key.startsWith(def.prefix)) return kind;
  }
  return null;
}
function accountKey(id){ return `hermetic:account:${id}`; }
function venueKey(accountId, venueId){ return `hermetic:venue:${accountId}:${venueId}`; }

function newId(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
}
function blankRecord(extra){
  return Object.assign({ rev: 0, updatedAt: 0, createdAt: Date.now(), fieldTs: {}, lastWriter: CLIENT_ID }, extra);
}
/* Stamp a field as changed now. Every mutation goes through this -- a field
   written without a stamp looks infinitely old and loses every merge. */
function stampField(record, path, at){
  record.fieldTs = record.fieldTs || {};
  record.fieldTs[path] = at || Date.now();
}
function tsOf(record, path){
  return (record && record.fieldTs && record.fieldTs[path]) || 0;
}

/* Which of the two holds the newer value for one field. */
function pickSide(local, remote, path){
  const lt = tsOf(local, path), rt = tsOf(remote, path);
  if (rt > lt) return remote;
  if (lt > rt) return local;
  return String(remote.lastWriter || '') > String(local.lastWriter || '') ? remote : local;
}

function mergeScalars(local, remote, out, paths){
  for (const path of paths){
    const src = pickSide(local, remote, path);
    out[path] = src[path];
    const ts = tsOf(src, path);
    if (ts) out.fieldTs[path] = ts;
  }
}

/* Uploaded files merge as a union, never a last-write-wins overwrite: two
   people uploading during the same call must both end up with their file.
   Removals ride along as ids in docsRemoved so a delete still propagates. */
function docKeyOf(d){ return (d && (d.fileId || d.link || d.name)) || ''; }
function mergeDocs(local, remote){
  const removed = new Set([...(local.docsRemoved || []), ...(remote.docsRemoved || [])]);
  // Whichever side touched its file list last wins on the entries both hold, so
  // a name or link corrected against Drive on one browser is not held back by
  // the other's older copy of the same file. Entries only one side has are kept
  // either way: that is the union that stops two uploads erasing each other.
  const first = tsOf(remote, 'data.docs') > tsOf(local, 'data.docs') ? remote : local;
  const second = first === remote ? local : remote;
  const byKey = new Map();
  for (const d of [...(((first.data || {}).docs) || []), ...(((second.data || {}).docs) || [])]){
    const k = docKeyOf(d);
    if (!k || removed.has(k) || byKey.has(k)) continue;
    byKey.set(k, d);
  }
  return { docs: [...byKey.values()], docsRemoved: [...removed] };
}

/* =================================================================
   WHAT DRIVE SAYS HAPPENED TO THE FILES

   Drive is a shared folder that people tidy: files get renamed,
   dragged elsewhere, and thrown away, none of which the console would
   otherwise hear about. It would go on offering a chip that links to
   a file nobody can open.

   Pure, so the rules are pinned down by tests rather than by reading:
   a rename updates the name, a move records the folder, a file that
   is gone is marked rather than removed, and a file the check said
   nothing about is left exactly as it was.
================================================================= */
function applyFileCheck(docs, info){
  let changed = false;
  const next = (docs || []).map(doc => {
    const found = doc && doc.fileId ? info[doc.fileId] : null;
    if (!found) return doc;                 // not asked about, or never uploaded
    const out = Object.assign({}, doc);
    const gone = !found.exists ? 'deleted' : (found.trashed ? 'trashed' : '');
    if ((out.gone || '') !== gone){
      if (gone) out.gone = gone; else delete out.gone;
      changed = true;
    }
    // A file in the trash keeps the name and category it was filed under: they
    // are what makes it findable if someone restores it. Marked, never removed
    // -- dropping the entry would wipe that from everyone's screen for what may
    // be a file that is about to come back.
    if (gone) return out;
    if (found.name && found.name !== out.name){ out.name = found.name; changed = true; }
    if (found.url && found.url !== out.link){ out.link = found.url; changed = true; }
    const folder = found.folderName || '';
    if (folder !== (out.folderName || '')){
      if (folder) out.folderName = folder; else delete out.folderName;
      changed = true;
    }
    return out;
  });
  return { docs: next, changed };
}

function mergeVenue(local, remote){
  const out = blankRecord({
    id: local.id || remote.id,
    accountId: local.accountId || remote.accountId,
    createdAt: Math.min(local.createdAt || Infinity, remote.createdAt || Infinity) || Date.now(),
    data: {}
  });
  mergeScalars(local, remote, out, RECORD_KINDS.venue.scalars);
  // The union of both sides' keys, so a field only one of them knows about
  // (an older client, a schema addition) is never dropped.
  const keys = new Set([...Object.keys(local.data || {}), ...Object.keys(remote.data || {})]);
  keys.delete('docs');
  for (const k of keys){
    const path = 'data.' + k;
    const src = pickSide(local, remote, path);
    out.data[k] = (src.data || {})[k];
    const ts = tsOf(src, path);
    if (ts) out.fieldTs[path] = ts;
  }
  const docs = mergeDocs(local, remote);
  out.data.docs = docs.docs;
  out.docsRemoved = docs.docsRemoved;
  out.lastEditedAt = Math.max(local.lastEditedAt || 0, remote.lastEditedAt || 0);
  // The later side wins: whoever copied last did so, and a merge that forgot it
  // would tell the other browser the venue had gone back to being uncopied.
  // Left off entirely when neither side has it -- inventing a zero here would
  // make every client push every venue back once to say nothing.
  const copiedAt = Math.max(local.lastCopiedAt || 0, remote.lastCopiedAt || 0);
  if (copiedAt) out.lastCopiedAt = copiedAt;
  return out;
}

function mergeAccount(local, remote){
  const out = blankRecord({
    id: local.id || remote.id,
    createdAt: Math.min(local.createdAt || Infinity, remote.createdAt || Infinity) || Date.now()
  });
  mergeScalars(local, remote, out, RECORD_KINDS.account.scalars);
  return out;
}

function mergeSettings(local, remote){
  const out = blankRecord({});
  mergeScalars(local, remote, out, ['rootFolderName', 'rootFolderId']);
  return out;
}

const MERGERS = { account: mergeAccount, venue: mergeVenue, settings: mergeSettings };

function mergeRecords(kind, local, remote){
  if (!local) return remote;
  if (!remote) return local;
  const fn = MERGERS[kind];
  if (!fn) return (remote.updatedAt || 0) >= (local.updatedAt || 0) ? remote : local;
  const out = fn(local, remote);
  // createdAt is the one field a merge must never invent. blankRecord stamps it
  // with the current time, so a merger built on one produces a record that
  // differs from the one it just merged -- which applyRemote reads as a change
  // and pushes back, on every poll, for every client, forever. Settle it here
  // so no merger can get it wrong.
  const born = Math.min(local.createdAt || Infinity, remote.createdAt || Infinity);
  if (born === Infinity) delete out.createdAt; else out.createdAt = born;
  out.rev = Math.max(local.rev || 0, remote.rev || 0);
  out.updatedAt = Math.max(local.updatedAt || 0, remote.updatedAt || 0);
  const newer = (remote.updatedAt || 0) >= (local.updatedAt || 0) ? remote : local;
  out.lastWriter = newer.lastWriter;
  if (newer.lastWriterName) out.lastWriterName = newer.lastWriterName;
  return out;
}

/* Key order out of a merge does not match key order off the wire, so comparing
   two records means comparing them canonically. Without this, every pull would
   decide every record had changed and push all of them straight back -- a
   write storm that grows with the size of the team. */
function canonical(value){
  if (value === null || typeof value !== 'object') return JSON.stringify(value) || 'null';
  if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
  return '{' + Object.keys(value).sort()
    .filter(k => value[k] !== undefined)
    .map(k => JSON.stringify(k) + ':' + canonical(value[k])).join(',') + '}';
}

function parseRecord(json){
  if (json === null || json === undefined || json === '') return null;
  try{
    const o = JSON.parse(json);
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : null;
  }catch(e){ return null; }
}

/* =================================================================
   WRITE QUEUE

   A write lands in the mirror at once and goes up in the background,
   so typing on a call never waits on a round trip. What it must not
   do is give up: a failed write used to be logged and forgotten,
   which left the pill saying "Synced" over work that existed only in
   one browser. Failures stay queued, retry with backoff, and are
   remembered across a reload through hermetic:dirtyKeys.
================================================================= */
const writeQueue = new Map();    // key -> record; a newer edit replaces the older
let writerRunning = false;
let writeFailures = 0;
let lastWriteError = '';

/* How often queued work is allowed up to the Sheet. Every edit reaches the
   local mirror the instant it is typed; this is only about the round trip.
   Without it a save went up on every debounce, so filling in one card meant a
   POST every second or so -- a lane Apps Script shares with everybody else's
   polls, and a status pill that never stopped flickering. The queue is keyed by
   record, so a minute of typing in one box collapses into one write. */
const SYNC_INTERVAL_MS = 30000;
let lastWriteAt = 0;
let lastSyncedAt = 0;      // when the queue last emptied, for the pill's tooltip
let writeTimer = null;

/* Queue work for the next window. An idle console still saves at once: the
   wait only applies when something went up inside the last interval. */
function scheduleWrite(){
  if (!syncUrl || !writeQueue.size || writerRunning || writeTimer) return;
  const due = Math.max(0, lastWriteAt + SYNC_INTERVAL_MS - Date.now());
  writeTimer = setTimeout(()=>{ writeTimer = null; runWriter(); }, due);
}
/* Skip the wait: the tab is going away, or something is waiting on the Sheet
   being up to date. */
function writeNow(){
  clearTimeout(writeTimer);
  writeTimer = null;
  runWriter();
}

function persistDirty(){
  try{ localStorage.setItem('hermetic:dirtyKeys', JSON.stringify([...writeQueue.keys()])); }
  catch(e){}
}

/* Save a record: stamp it, mirror it, and queue it for the Sheet. The rev it
   carries is the one we are creating; rev - 1 is the base the Sheet must still
   be at for our write to be safe. */
function saveRecord(key, record){
  record.rev = (record.rev || 0) + 1;
  record.updatedAt = Date.now();
  record.lastWriter = CLIENT_ID;
  // The id is what merges tie-break on; the name is what a person reading the
  // spreadsheet needs. Absent rather than empty when nobody has set a name:
  // a key that is always present but sometimes blank makes every merged record
  // differ from the one on the wire, which applyRemote reads as a change and
  // pushes straight back, for every record, on every poll.
  if (displayName) record.lastWriterName = displayName; else delete record.lastWriterName;
  localWrite(key, record);
  if (syncUrl){
    writeQueue.set(key, record);
    persistDirty();
    scheduleWrite();
  }
  renderSyncPill();
  return record;
}

/* fetch() waits forever by default. One request that never answers -- a dropped
   connection, Apps Script hanging on to the lane -- left the writer sitting in
   an await that could not finish: the queue stayed full, the pill span forever,
   and nothing else ever went up. A request that has not answered inside this is
   treated as a failure, which the retry path already knows how to handle. */
const REQUEST_TIMEOUT_MS = 25000;
async function fetchWithTimeout(url, opts){
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), REQUEST_TIMEOUT_MS);
  try{
    return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
  }catch(e){
    throw (e && e.name === 'AbortError')
      ? new Error('The Sheet did not answer in time')
      : e;
  }finally{ clearTimeout(timer); }
}

function backoffMs(failures){
  return Math.min(30000, 800 * Math.pow(2, Math.min(failures, 5))) + Math.random() * 400;
}

async function runWriter(){
  if (writerRunning || !syncUrl) return;
  writerRunning = true;
  lastWriteAt = Date.now();
  try{
    while (writeQueue.size){
      const key = writeQueue.keys().next().value;
      const record = writeQueue.get(key);
      const result = await pushRecord(key, record);
      if (result.ok){
        // Only clear it if no newer edit arrived while this one was in flight.
        if (writeQueue.get(key) === record) writeQueue.delete(key);
        writeFailures = 0;
        lastWriteError = '';
      }else{
        writeFailures++;
        lastWriteError = result.error || 'Could not reach the Sheet';
        // Send it to the back of the queue. One row the Sheet will not accept
        // must not hold every other row hostage behind it -- a Map iterates in
        // insertion order, so re-inserting is what moves it.
        if (writeQueue.get(key) === record){
          writeQueue.delete(key);
          writeQueue.set(key, record);
        }
        renderSyncPill();
        await sleep(backoffMs(writeFailures));
      }
      persistDirty();
      renderSyncPill();
    }
  }finally{
    writerRunning = false;
    lastWriteAt = Date.now();
    if (!writeQueue.size) lastSyncedAt = lastWriteAt;
    renderSyncPill();
    // A save that arrived while the loop was on its way out found writerRunning
    // still true and did nothing. Pick it up on the next window rather than
    // leave it sitting.
    scheduleWrite();
  }
}

/* One record to the Sheet, resolving conflicts by merging rather than by
   overwriting. A conflict means someone saved between our last read and this
   write: take what is there now, merge field by field, and try again on top of
   their revision. Retries are bounded so a pathological loop cannot spin. */
async function pushRecord(key, record){
  const kind = kindOfKey(key);
  let current = record;
  for (let attempt = 0; attempt < 6; attempt++){
    let data;
    try{
      const res = await fetchWithTimeout(syncUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'set',
          key,
          value: JSON.stringify(current),
          ifRev: Math.max((current.rev || 1) - 1, 0)
        })
      });
      data = await res.json();
    }catch(e){
      return { ok: false, error: e.message };
    }
    if (data && data.conflict){
      const remote = parseRecord(data.current);
      if (!remote) return { ok: false, error: 'Sheet holds an unreadable value for ' + key };
      const merged = mergeRecords(kind, current, remote);
      // Rebase onto their revision so the retry's guard matches the Sheet.
      merged.rev = (typeof data.rev === 'number' ? data.rev : (remote.rev || 0)) + 1;
      merged.updatedAt = Date.now();
      merged.lastWriter = CLIENT_ID;
      localWrite(key, merged);
      if (writeQueue.get(key) === current) writeQueue.set(key, merged);
      current = merged;
      onRemoteChange();
      continue;
    }
    if (data && data.error) return { ok: false, error: data.error };
    return { ok: true };
  }
  return { ok: false, error: 'Gave up merging concurrent edits to ' + key };
}

/* Anything the mirror still owes the Sheet, re-queued after a reload. Without
   this, closing the laptop while a write was failing lost it for good. */
function requeueDirty(){
  if (!syncUrl) return;
  let keys = [];
  try{ keys = JSON.parse(localStorage.getItem('hermetic:dirtyKeys') || '[]'); }catch(e){}
  for (const key of keys){
    const record = localRead(key);
    if (record && typeof record === 'object') writeQueue.set(key, record);
  }
  if (writeQueue.size){ persistDirty(); writeNow(); }
}

function flushWrites(){
  writeNow();
  return new Promise(resolve => {
    const tick = () => (writeQueue.size ? setTimeout(tick, 150) : resolve());
    tick();
  });
}

/* =================================================================
   PULL

   One request brings every row that changed since the last pull, so
   polling on a 15s heartbeat stays cheap even with the whole team on
   calls. The first pull of a session asks for everything.
================================================================= */
/* Apps Script runs every request as the deploying user and serializes them at
   roughly a second each, so the whole team shares one lane. At these rates a
   team of eight costs about 0.6 requests a second including writes, which the
   lane absorbs; halving the intervals would saturate it and make saves queue
   behind polls. Pulls are skipped entirely while the tab is hidden, which is
   most of any given call. */
const PULL_INTERVAL_MS = 20000;
const CLOCK_PAD_MS = 5000;   // re-read a small overlap; merging twice is a no-op

function hydrate(){
  if (!kvHydrating) kvHydrating = pull({ full: true });
  return kvHydrating;
}

async function pull({ full } = {}){
  if (!syncUrl){ kvHydrated = true; return false; }
  const since = full || !lastPullAt || serverVersion < 3 ? 0 : lastPullAt;
  let changed = false;
  try{
    const url = `${syncUrl}?action=getAll&prefix=${encodeURIComponent(KV_PREFIX)}` +
                (since ? `&since=${since}` : '');
    const res = await fetchWithTimeout(url);
    const data = await res.json();
    if (!data || !Array.isArray(data.items)) throw new Error('getAll returned no items');
    if (typeof data.serverVersion === 'number') serverVersion = data.serverVersion;
    changed = applyRemote(data.items);
    // A full read is the only moment this browser can see what the Sheet does
    // not have, so it is the only moment local-only work can be noticed.
    if (since === 0) queueLocalOnly(data.items);
    // Trust the server's clock over ours -- browser clocks on a team of laptops
    // disagree by enough to skip a row. The pad re-reads a small overlap.
    lastPullAt = Math.max(0, (typeof data.now === 'number' ? data.now : Date.now()) - CLOCK_PAD_MS);
  }catch(e){
    console.warn('Sheet pull failed, using local cache:', e);
  }
  kvHydrated = true;
  return changed;
}

let pullTimer = null;
let pulling = false;
async function pullNow(){
  if (pulling || document.hidden) return;
  pulling = true;
  try{
    if (await pull({})) onRemoteChange();
  }finally{ pulling = false; }
}
function startPolling(){
  if (!syncUrl || pullTimer) return;
  pullTimer = setInterval(pullNow, PULL_INTERVAL_MS);
  // A specialist lives in another tab during a call; catching up the moment
  // they come back matters more than the interval does.
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden){ pullNow(); heartbeat(); }
    // Going away: a tab that is hidden may never come back, and queued work
    // must not sit out the rest of its window on a machine nobody returns to.
    else writeNow();
  });
  window.addEventListener('online', ()=>{ pullNow(); writeNow(); });
  // Last chance before the tab closes. What does not make it stays in
  // hermetic:dirtyKeys and goes up on the next load.
  window.addEventListener('pagehide', writeNow);
}

/* Records this browser holds that the Sheet has never seen.

   Nothing else pushes them. applyRemote only walks the rows that came back, so
   a key the Sheet is missing is a key nothing ever compares against, and the
   write queue only holds what was edited this session or left dirty by the
   last one. An account made before the sync URL was pasted, or a queued write
   lost when the tab closed and localStorage would not keep the dirty list,
   therefore stayed on one laptop for good -- while the pill said Synced and
   the spreadsheet showed that account's locations with no account to file them
   under.

   Queued as they stand rather than re-saved: this is not an edit, and bumping
   the revision would claim it was one. If the Sheet has since gained the row,
   the write conflicts and merges like any other. */
function queueLocalOnly(items){
  if (!syncUrl) return 0;
  const remote = new Set(items.map(it => it && it.key).filter(Boolean));
  let queued = 0;
  for (const key of localKeys(KV_PREFIX)){
    if (remote.has(key)) continue;
    // Presence republishes itself on the heartbeat, the schema has its own
    // publisher, and a legacy list is folded by migrateToRecords rather than
    // uploaded. Anything else that is only here is work that has not landed.
    const kind = kindOfKey(key);
    if (kind !== 'account' && kind !== 'venue' && kind !== 'settings') continue;
    const record = localRead(key);
    // Arrays pass a bare typeof check and are not records; parseRecord rejects
    // them everywhere else and so does this.
    if (!record || typeof record !== 'object' || Array.isArray(record)) continue;
    writeQueue.set(key, record);
    queued++;
  }
  if (queued){
    console.warn('Sending ' + queued + ' record(s) the Sheet had never seen.');
    persistDirty();
    writeNow();
  }
  return queued;
}

function applyRemote(items){
  let changed = false;
  for (const item of items){
    if (!item || typeof item.key !== 'string') continue;
    const key = item.key;
    if (KV_LOCAL_ONLY.has(key) || !key.startsWith(KV_PREFIX)) continue;
    const kind = kindOfKey(key);
    let remote = parseRecord(item.value);

    // Rows this build does not own: the pre-record hermetic:accounts and
    // hermetic:venues:* lists, and the locations/campaigns before those. Mirror
    // them verbatim so migrateToRecords() can fold them. Without this, only the
    // one browser that happened to still hold them locally could ever migrate,
    // and a teammate opening the app on a clean machine would see an empty
    // sidebar over a Sheet full of accounts.
    if (!kind){
      if (localStorage.getItem(key) !== item.value){
        localWrite(key, item.value);
        changed = true;
      }
      continue;
    }

    if (!remote) continue;

    if (kind === 'presence'){ applyPresence(remote); continue; }

    // A key we are still trying to write is settled by that write's own
    // conflict merge; merging it here as well would only race with it.
    if (writeQueue.has(key)) continue;

    const local = localRead(key);
    const merged = local ? mergeRecords(kind, local, remote) : remote;
    const json = JSON.stringify(merged);
    if (localStorage.getItem(key) !== json){
      localWrite(key, json);
      changed = true;
    }
    // If merging revived something the Sheet does not have -- an edit made
    // offline, or a field we hold a newer stamp for -- push it back up. When
    // the merge matched what arrived, there is nothing to send.
    if (local && canonical(merged) !== canonical(remote)){
      merged.rev = (remote.rev || 0);      // saveRecord bumps to remote.rev + 1
      saveRecord(key, merged);
    }
  }
  // Rows absent from the Sheet stay in the mirror on purpose: a value that
  // exists only locally is usually one whose upload has not landed yet.
  return changed;
}

/* The readable view in the spreadsheet needs to know what the sections are
   called, and the schema lives here, not in the Apps Script. Publishing it as a
   plain row keeps the two from drifting: rename a section in this file and the
   spreadsheet picks up the new wording on its next refresh, with no second copy
   to remember to update. Written straight past the record machinery -- it has
   no fields to merge, and every browser publishes the same thing. */
function publishSchema(){
  if (!syncUrl) return;
  const parts = VENUE_PARTS.map(part => ({
    title: part.title,
    sections: part.schema.filter(s => s.type === 'block').map(s => ({ key: s.key, title: s.title }))
  }));
  const key = 'hermetic:schema';
  const stored = localRead(key);
  // Compare the shape, not the stamp, so an unchanged schema is not rewritten
  // by every browser on every load.
  if (stored && JSON.stringify(stored.parts) === JSON.stringify(parts)) return;
  const payload = { parts, updatedAt: Date.now() };
  // Mirrored only once the Sheet has it. Writing it locally first and hoping
  // meant that a single failed publish -- a flaky load, a deployment being
  // updated -- left this browser believing the schema was up while the Sheet
  // had never seen it, and the check above then skipped it on every later load.
  // The row stayed missing for good and the readable view fell back to guessing
  // section names from whatever keys the data happened to carry.
  fetchWithTimeout(syncUrl, {
    method: 'POST',
    headers: { 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action:'set', key, value: JSON.stringify(payload) })
  }).then(res => res.json())
    .then(data => { if (data && !data.error) localWrite(key, payload); })
    .catch(()=>{});   // the next load republishes it
}

/* =================================================================
   PRESENCE

   Who else has this account open. Cheap to run and it prevents the
   collision rather than resolving it -- seeing "Dana is in here" stops
   the second edit from being made at all.
================================================================= */
const PRESENCE_TTL_MS = 100000;
const HEARTBEAT_MS = 40000;
const presenceByClient = new Map();   // clientId -> {clientId, name, accountId, at}
let heartbeatTimer = null;

function applyPresence(rec){
  if (!rec || !rec.clientId || rec.clientId === CLIENT_ID) return;
  presenceByClient.set(rec.clientId, rec);
  renderPresence();
}
function peersOn(accountId){
  const cutoff = Date.now() - PRESENCE_TTL_MS;
  const out = [];
  for (const p of presenceByClient.values()){
    if (p.accountId === accountId && (p.at || 0) > cutoff) out.push(p);
  }
  return out.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
}
/* Presence is one row per browser, not one per browser per account, so the
   rows stay bounded however many accounts the team works through. It is
   written straight past the record machinery: there is only ever one writer
   for this key, so there is nothing to merge and no revision to guard. */
function heartbeat(){
  if (!syncUrl || !displayName) return;
  // A backgrounded tab is not "in" an account in any useful sense, and the TTL
  // covers the gap until it comes back.
  if (document.hidden) return;
  const rec = {
    clientId: CLIENT_ID,
    name: displayName,
    accountId: state.currentAccountId || null,
    at: Date.now(),
    updatedAt: Date.now(),
    rev: 0
  };
  const key = `hermetic:presence:${CLIENT_ID}`;
  localWrite(key, rec);
  fetch(syncUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'set', key, value: JSON.stringify(rec) })
  }).catch(()=>{});   // a missed heartbeat only ages this browser out early
}
function startHeartbeat(){
  if (heartbeatTimer) return;
  heartbeat();
  heartbeatTimer = setInterval(heartbeat, HEARTBEAT_MS);
}

/* Reports whether the URL answers, and which backend features it has. A
   deployment older than SERVER_VERSION 3 still works, but silently: its setKey_
   ignores ifRev, so concurrent edits overwrite instead of merging. That is
   worth saying out loud rather than discovering from lost work. */
async function testSyncConnection(url){
  try{
    const res = await fetch(`${url}?action=getAll&prefix=${encodeURIComponent(KV_PREFIX)}`);
    const data = await res.json();
    if (Array.isArray(data.items)){
      return { ok:true, batch:true, serverVersion: Number(data.serverVersion || 0) };
    }
  }catch(e){ /* fall through to the older probe */ }
  try{
    const res = await fetch(`${url}?action=list&prefix=${encodeURIComponent(KV_PREFIX)}`);
    const data = await res.json();
    if (Array.isArray(data.keys)) return { ok:true, batch:false, serverVersion: 0 };
  }catch(e){ /* unreachable */ }
  return { ok:false, batch:false, serverVersion: 0 };
}

/* Last line of defence. Everything is mirrored locally and re-queued on the
   next load, so closing here does not lose the work -- but it does strand it
   in one browser, invisible to whoever picks the account up next. */
window.addEventListener('beforeunload', (e) => {
  // A queued write survives a reload; a file half way to Drive does not.
  if (!writeQueue.size && !busyUploads.size) return;
  e.preventDefault();
  e.returnValue = '';
});
function extractFolderId(input){
  const s = (input || '').trim();
  const m = s.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return s;
}
/* Reading the file is the one leg of an upload whose length the browser will
   actually tell us, so it is the one that gets a real percentage. */
function fileToBase64(file, onProgress){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    if (onProgress){
      reader.onprogress = (e)=>{ if (e.lengthComputable) onProgress(e.loaded / e.total); };
    }
    reader.onload = () => { if (onProgress) onProgress(1); resolve(reader.result.split(',')[1]); };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
/**
 * Apps Script answers with HTML, not JSON, whenever the request never reaches
 * doPost -- a sign-in page when the deployment is not shared with "Anyone", a
 * consent page when the deployer has not approved the current scopes, an error
 * page when the script throws fatally. Parsing that as JSON reports "Unexpected
 * token '<'", which names the symptom and hides the cause, so read the page
 * well enough to say which of the three it was.
 */
async function readScriptJson(res){
  return parseScriptText(await res.text());
}

/* Apps Script answers an error with an HTML page rather than an error status,
   so every response has to be sniffed. Split out from readScriptJson so the
   XHR upload path, which needs progress events and therefore cannot use fetch,
   reports failures in exactly the same words. */
function parseScriptText(text){
  try{
    return JSON.parse(text);
  }catch(e){
    const title = (text.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [,''])[1].trim();
    if (/accounts\.google\.com|sign in|signin/i.test(text) || /moved temporarily/i.test(title)){
      throw new Error('Google returned a sign-in page. The deployment is not public: Deploy > Manage deployments > edit > set "Who has access" to Anyone, then New version.');
    }
    if (/authorization is required|authoriz/i.test(text)){
      throw new Error('Google returned an authorization page. Open the Apps Script editor, run authorize(), accept the Drive prompt, then Deploy > Manage deployments > edit > New version.');
    }
    throw new Error('The script returned a web page instead of data' + (title ? ' ("' + title + '")' : '') + '. That usually means the script hit an error. Check Apps Script > Executions for the failing run.');
  }
}
/* WHY THERE IS NO PERCENTAGE ON THE NETWORK LEG
   XMLHttpRequest is the only thing that reports how much of a request body has
   gone out, and reaching it costs more than it is worth here: per the XHR spec,
   registering any listener on xhr.upload sets the use-CORS-preflight flag, so
   the browser sends an OPTIONS request first. An Apps Script web app has no
   doOptions and never answers one, the preflight fails, and the upload fails
   with it. A plain fetch with a text/plain body stays a simple request and goes
   straight through, which is why the rest of this file uses it.

   So the only honest report of the network leg is that it is still running.
   Reading the file is measurable and does get a real percentage; after that the
   bar goes indeterminate and a running clock shows the request is alive. No
   invented percentages: a fake bar sitting at 90% is worse than no bar. */
async function uploadDocumentToDrive({ segments, category, file, onPhase }){
  if (!syncUrl) throw new Error('Set up Google Sheet sync in Settings first. File upload uses the same connection.');
  const phase = onPhase || (()=>{});
  phase('reading', 0);
  const base64 = await fileToBase64(file, (fraction)=> phase('reading', fraction));
  phase('sending');
  const res = await fetch(syncUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action:'uploadFile',
      rootFolderId: extractFolderId(state.settings.rootFolderId),
      rootFolderName: state.settings.rootFolderName,
      segments,
      category,
      filename: file.name,
      mimeType: file.type || 'application/octet-stream',
      base64
    })
  });
  const data = await readScriptJson(res);
  if (data.error) throw new Error(data.error);
  return data; // { fileId, link, folderId, folderLink }
}

/* Copies a file that is already in Drive into another venue's folder. The copy
   is done by the Apps Script, inside Drive -- pulling the bytes down and
   pushing them back up would make duplicating a venue as slow as uploading its
   files again, and would fail on anything that was over the upload ceiling. */
async function copyDocumentInDrive({ segments, category, fileId, filename }){
  if (!syncUrl) throw new Error('Set up Google Sheet sync in Settings first. Copying files uses the same connection.');
  const res = await fetch(syncUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action:'copyFile',
      rootFolderId: extractFolderId(state.settings.rootFolderId),
      rootFolderName: state.settings.rootFolderName,
      segments,
      category,
      fileId,
      filename
    })
  });
  const data = await readScriptJson(res);
  if (data.error) throw new Error(data.error);
  return data; // { fileId, link, folderId, folderLink }
}

/* How long a location's files are trusted before Drive is asked again. Short
   enough that tidying up in Drive shows up while you are still in the call that
   prompted it, long enough that reopening cards does not hammer a backend that
   runs every request one at a time. */
const FILE_CHECK_TTL_MS = 60000;
const fileCheckedAt = new Map();      // location id -> when Drive last answered

/* Drive is somewhere people tidy up in another tab, and the console has to
   notice on its own. The check used to run only from a repaint, so a card left
   open on screen was never asked about again: a file deleted in Drive sat there
   looking fine until somebody collapsed the card or pressed the refresh button.
   Open cards are now asked on a timer, and again whenever this tab comes back to
   the front -- which is the moment right after the deleting was done. */
let fileSweepTimer = null;
function sweepOpenLocationFiles(opts){
  if (!syncUrl || document.hidden) return;
  if (state.view !== 'main' || !state.currentAccountId) return;
  for (const venueId of state.openItemIds){
    if (readVenue(state.currentAccountId, venueId)){
      verifyLocationFiles(state.currentAccountId, venueId, opts);
    }
  }
}
function startFileSweep(){
  if (!syncUrl || fileSweepTimer) return;
  fileSweepTimer = setInterval(()=> sweepOpenLocationFiles(), FILE_CHECK_TTL_MS);
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden) sweepOpenLocationFiles({ maxAge: 5000 });
  });
}

async function verifyLocationFiles(accountId, venueId, opts){
  if (!syncUrl) return;
  if (serverVersion && serverVersion < 5) return;     // backend has no checkFiles
  // How old an answer may be and still be trusted. The button forces a fresh
  // one; coming back to the tab settles for a few seconds old, since the usual
  // reason for switching back is having just changed something in Drive.
  const maxAge = (opts && opts.force) ? 0
    : (opts && typeof opts.maxAge === 'number') ? opts.maxAge
    : FILE_CHECK_TTL_MS;
  if (Date.now() - (fileCheckedAt.get(venueId) || 0) < maxAge) return;

  const record = readVenue(accountId, venueId);
  const ids = (((record || {}).data || {}).docs || []).filter(d => d.fileId).map(d => d.fileId);
  if (!ids.length) return;
  fileCheckedAt.set(venueId, Date.now());

  let info;
  try{
    const res = await fetch(syncUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'checkFiles', fileIds: ids })
    });
    const data = await readScriptJson(res);
    if (data.error) throw new Error(data.error);
    info = data.files || {};
  }catch(e){
    // Not being able to ask is not the same as the files being gone, so nothing
    // is marked. Clear the stamp so the next open tries again.
    console.warn('Could not check Drive files:', e);
    fileCheckedAt.delete(venueId);
    return;
  }

  let applied = false;
  editVenue(accountId, venueId, (rec)=>{
    const result = applyFileCheck(rec.data.docs, info);
    if (!result.changed) return null;
    rec.data.docs = result.docs;
    applied = true;
    const paths = ['data.docs'];
    paths.noTouch = true;    // Drive being tidied is not an edit to the answers
    return paths;
  });
  if (applied) await renderMain({ preserveFocus: true, background: true });
}

/* =================================================================
   STATE
================================================================= */
/* Nothing shared is cached here. Accounts and venues are read from
   the mirror at render time, so a pull that lands in the background shows up on
   the next paint without any cache to invalidate. What stays is view state:
   what is selected, what is expanded. */
let state = {
  accounts: [],                  // derived from the mirror by readTopLevelState()
  currentAccountId: null,
  view: 'main',                  // 'main' or 'settings'; a background repaint respects it
  settings: { rootFolderName: "ONBOARDING - Custom Prompt Uploads", rootFolderId: "" },
  openItemIds: new Set(),
  sidebarCollapsed: false
};

/* =================================================================
   DERIVED READS

   The sidebar and the venue list are derived from whichever rows are
   in the mirror, not from a stored list. That is the whole reason two
   people can add accounts at the same time: there is no list for the
   second save to overwrite.
================================================================= */
function readAccounts(){
  return localKeys('hermetic:account:')
    .map(localRead)
    .filter(a => a && a.id && !a.deleted)
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) ||
                    String(a.name || '').localeCompare(String(b.name || '')));
}
function readAccount(id){
  const rec = localRead(accountKey(id));
  return rec && !rec.deleted ? rec : null;
}
function readVenues(accountId){
  return localKeys(`hermetic:venue:${accountId}:`)
    .map(localRead)
    .filter(v => v && v.id && !v.deleted)
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
function readVenue(accountId, venueId){
  const rec = localRead(venueKey(accountId, venueId));
  return rec && !rec.deleted ? rec : null;
}
function readSettings(){
  const rec = localRead('hermetic:settings') || {};
  return {
    rootFolderName: rec.rootFolderName || DEFAULT_SETTINGS.rootFolderName,
    rootFolderId: rec.rootFolderId || ''
  };
}

/* =================================================================
   MUTATIONS

   Every write goes through one of these, so no caller can change a
   field without stamping it -- an unstamped field looks infinitely
   old and loses every merge it takes part in.
================================================================= */
function editVenue(accountId, venueId, mutate){
  const key = venueKey(accountId, venueId);
  const record = localRead(key);
  if (!record) return null;
  const at = Date.now();
  const touched = mutate(record, at);
  // No change means no write. A save here would bump the revision, push a row,
  // and make every other browser merge it, all to say nothing.
  if (!touched || !touched.length) return null;
  for (const path of touched) stampField(record, path, at);
  if (!touched.noTouch) record.lastEditedAt = at;
  return saveRecord(key, record);
}
function setVenueField(accountId, venueId, field, value){
  return editVenue(accountId, venueId, (record, at) => {
    setAtPath(record.data, field, value);
    return ['data.' + field];
  });
}
/* Copying for Claude is the moment the answers leave the console, so it is the
   moment the venue stops being outdated. It is not an edit: the stamp must not
   move lastEditedAt, or every copy would immediately mark itself stale. */
function markVenueCopied(accountId, venueId){
  const key = venueKey(accountId, venueId);
  const record = localRead(key);
  if (!record) return null;
  record.lastCopiedAt = Date.now();
  return saveRecord(key, record);
}
function createVenue(accountId, name){
  const at = Date.now();
  const record = blankRecord({
    id: newId('i'), accountId, name, deleted: false,
    lastEditedAt: at, data: newVenueData(), docsRemoved: []
  });
  stampField(record, 'name', at);
  stampField(record, 'deleted', at);
  saveRecord(venueKey(accountId, record.id), record);
  return record;
}
/* A duplicate is a new record, not a copy of the old row.
   Cloning the row wholesale would carry the source's id, revision and field
   stamps with it, and the first save would reach the Sheet looking like a
   stale write of the *source* venue -- the guard would refuse it, the merge
   would fold the copy back into the original, and the duplicate would quietly
   eat the venue it came from. So: new id, new key, rev starts at zero, and
   every field stamped now.

   The answers carry over. The copy has never been handed to Claude under its
   own name, so it starts out uncopied rather than arriving pre-marked as done.
   Files are attached afterwards, one at a time, as each Drive copy lands. */
function duplicateVenueRecord(sourceAccountId, sourceVenueId, targetAccountId, name){
  const src = readVenue(sourceAccountId, sourceVenueId);
  if (!src) return null;
  const at = Date.now();
  const data = JSON.parse(JSON.stringify(src.data || newVenueData()));
  data.docs = [];
  data.drive_link = '';
  const record = blankRecord({
    id: newId('i'), accountId: targetAccountId, name, deleted: false,
    createdAt: at, lastEditedAt: at, data, docsRemoved: []
  });
  stampField(record, 'name', at);
  stampField(record, 'deleted', at);
  Object.keys(data).forEach(k => { if (k !== 'docs') stampField(record, 'data.' + k, at); });
  saveRecord(venueKey(targetAccountId, record.id), record);
  return record;
}

function deleteVenue(accountId, venueId){
  editVenue(accountId, venueId, (record, at) => {
    record.deleted = true;
    return ['deleted'];
  });
}
function createAccount(name){
  const at = Date.now();
  const record = blankRecord({ id: newId('a'), name, drive_link: '', deleted: false });
  stampField(record, 'name', at);
  stampField(record, 'drive_link', at);
  stampField(record, 'deleted', at);
  saveRecord(accountKey(record.id), record);
  return record;
}
/* Deleting an account tombstones every location under it as well. Left alone
   those rows would be unreachable but still real: pulled down on every full
   sync for good, and counted in nobody's idea of what the Sheet holds. The
   account goes last, so a browser that pulls half way through this still sees
   an account whose locations are going rather than an empty one. */
function deleteAccount(accountId){
  const at = Date.now();
  for (const venue of readVenues(accountId)){
    const key = venueKey(accountId, venue.id);
    const record = localRead(key);
    if (!record || record.deleted) continue;
    record.deleted = true;
    stampField(record, 'deleted', at);
    saveRecord(key, record);
  }
  const key = accountKey(accountId);
  const record = localRead(key);
  if (!record) return null;
  record.deleted = true;
  stampField(record, 'deleted', at);
  return saveRecord(key, record);
}

function saveSettings(patch){
  const key = 'hermetic:settings';
  const existing = localRead(key);
  const record = (existing && typeof existing === 'object') ? existing : blankRecord({});
  const at = Date.now();
  for (const [k, v] of Object.entries(patch)){
    record[k] = v;
    stampField(record, k, at);
  }
  saveRecord(key, record);
  state.settings = readSettings();
}

function formatTimestamp(ms){
  if (!ms) return '';
  return new Date(ms).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

/* =================================================================
   MIGRATION

   Two old shapes feed in: the account/venue lists this build replaces
   with per-record rows, and before those, the separate location and
   campaign records. Both run key by key and write only rows that are
   absent, so two browsers migrating at the same moment converge on
   the same result instead of fighting. The old rows are left in the
   Sheet untouched -- they cost nothing and they are the way back.
================================================================= */
/* The source material box and the three generated-output boxes are gone from
   the console, but their text is still sitting in every record filled in before
   they went, pulled down on every sync and shown to nobody. Clear it once.

   The cleared fields are stamped now, not left unstamped: a teammate's browser
   still holds the old text, and an erasure that did not carry a time would lose
   the merge against it and be quietly undone on the next poll. It is not an
   edit, though -- wiping a box the console no longer has must not make a
   location look like its answers have moved on. */
const RETIRED_FIELDS = ['source_material', 'draft_location_doc', 'draft_campaign_doc',
                        'draft_open_questions', 'sub_venues_text'];
function stripRetiredFields(){
  for (const acc of readAccounts()){
    for (const venue of readVenues(acc.id)){
      if (!RETIRED_FIELDS.some(f => (venue.data || {})[f] !== undefined)) continue;
      editVenue(acc.id, venue.id, (record) => {
        const gone = RETIRED_FIELDS.filter(f => record.data[f] !== undefined);
        if (!gone.length) return null;
        gone.forEach(f => { delete record.data[f]; });
        const paths = gone.map(f => 'data.' + f);
        paths.noTouch = true;
        return paths;
      });
    }
  }
}

function migrateToRecords(){
  const legacyAccounts = localRead('hermetic:accounts');
  if (Array.isArray(legacyAccounts)){
    legacyAccounts.forEach((acc, i) => {
      if (!acc || !acc.id || localRead(accountKey(acc.id))) return;
      const at = (acc.createdAt || Date.now() - (legacyAccounts.length - i) * 1000);
      const record = blankRecord({
        id: acc.id, name: acc.name || 'Untitled', drive_link: acc.drive_link || '',
        deleted: false, createdAt: at
      });
      ['name','drive_link','deleted'].forEach(f => stampField(record, f, at));
      saveRecord(accountKey(acc.id), record);
    });
  }
  for (const acc of readAccounts()) migrateAccountVenues(acc.id);
}

function migrateAccountVenues(accountId){
  if (localKeys(`hermetic:venue:${accountId}:`).length) return;
  let list = localRead(`hermetic:venues:${accountId}`);
  if (!Array.isArray(list) || !list.length) list = migrateLegacyVenues(accountId);
  if (!Array.isArray(list) || !list.length) return;
  list.forEach((v, i) => {
    if (!v || !v.id || localRead(venueKey(accountId, v.id))) return;
    foldLegacyBlocks(v.data || {});
    const at = v.lastEditedAt || (Date.now() - (list.length - i) * 1000);
    const record = blankRecord({
      id: v.id, accountId, name: v.name || 'Untitled', deleted: false,
      createdAt: at, lastEditedAt: at, data: v.data || newVenueData(), docsRemoved: []
    });
    stampField(record, 'name', at);
    stampField(record, 'deleted', at);
    Object.keys(record.data).forEach(k => {
      if (k !== 'docs') stampField(record, 'data.' + k, at);
    });
    saveRecord(venueKey(accountId, v.id), record);
  });
}

/* One-time fold of the old separate location and campaign records into the
   combined venue record. A location with several campaigns becomes one venue
   per campaign, each carrying the same facts. */
function migrateLegacyVenues(accountId){
  const locations = localRead(`hermetic:locations:${accountId}`) || [];
  const campaigns = localRead(`hermetic:campaigns:${accountId}`) || [];
  if (!locations.length && !campaigns.length) return null;
  const venues = [];
  const claimed = new Set();
  for (const loc of locations){
    const mine = campaigns.filter(c => c.data && c.data.location_id === loc.id);
    mine.forEach(c => claimed.add(c.id));
    if (!mine.length){
      venues.push(mergeLegacyPair(loc.id, loc.name, loc, null));
      continue;
    }
    venues.push(mergeLegacyPair(loc.id, loc.name, loc, mine[0]));
    for (const extra of mine.slice(1)){
      venues.push(mergeLegacyPair(extra.id, `${loc.name} (${extra.name})`, loc, extra));
    }
  }
  for (const camp of campaigns){
    if (claimed.has(camp.id)) continue;
    venues.push(mergeLegacyPair(camp.id, camp.name, null, camp));
  }
  return venues;
}
function mergeLegacyPair(id, name, loc, camp){
  const ld = (loc && loc.data) || {};
  const cd = (camp && camp.data) || {};
  const data = newVenueData();
  const skip = new Set(['location_id','source_material','drive_link','docs','draft_doc','draft_open_questions','raw','raw_mode']);
  // 'raw'/'raw_mode' were only ever written by the retired paste-mode toggle.
  for (const src of [ld, cd]){
    for (const key of Object.keys(src)){
      if (skip.has(key)) continue;
      // Deep copy: one location with several campaigns becomes several venues,
      // which must not share the same rooms/menus arrays.
      data[key] = src[key] && typeof src[key] === 'object' ? JSON.parse(JSON.stringify(src[key])) : src[key];
    }
  }
  data.drive_link = ld.drive_link || cd.drive_link || '';
  data.docs = [...(ld.docs || []), ...(cd.docs || [])];
  return {
    id,
    name,
    lastEditedAt: Math.max((loc && loc.lastEditedAt) || 0, (camp && camp.lastEditedAt) || 0) || Date.now(),
    data
  };
}

/* Nothing here animates. The pill sits in the corner of the screen all day, and
   a spinner that restarts on every keystroke, every poll and every repaint reads
   as "something is wrong" even when everything is fine. It answers one question
   -- is this person's work safe -- and it only changes when the answer does. */
function renderSyncPill(){
  const el = document.getElementById('syncStatusPill');
  if (!el) return;
  const pill = (kind, ico, text) =>
    `<span class="badge badge-${kind}" style="width:100%; justify-content:center;">${icon(ico, 'icon', 12)}${text}</span>`;
  if (!syncUrl){
    el.title = 'Answers are saved in this browser only. Connect the Sheet in Settings to share them.';
    el.innerHTML = pill('slate','info','Not connected');
    return;
  }
  // A write that keeps failing must never be able to look like one that worked.
  if (writeQueue.size && writeFailures > 0){
    el.title = lastWriteError || '';
    el.innerHTML = pill('destructive','alert-triangle','Not saved yet, retrying');
    return;
  }
  // Typed but not sent yet is not an error and not a wait anybody needs to watch:
  // it is already safe in this browser, and it survives a reload.
  if (writeQueue.size){
    el.title = 'Saved in this browser. Goes up to the shared Sheet within 30 seconds.';
    el.innerHTML = pill('slate','check-circle','Saved here');
    return;
  }
  el.title = lastSyncedAt ? 'Everything is up on the shared Sheet as of ' + formatTimestamp(lastSyncedAt) : '';
  el.innerHTML = pill('success','check-circle','Saved');
}

/* Who else is in the account on screen. Rendered on its own so a pull can
   refresh it without repainting the form underneath. */
function renderPresence(){
  const el = document.getElementById('presenceBar');
  if (!el) return;
  const peers = peersOn(state.currentAccountId);
  if (!state.currentAccountId || !peers.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<span class="badge badge-warning" title="If two of you edit the same location at once, both sets of answers are kept. It is still easier to take one location each.">
      ${icon('users','icon',12)}Also here: ${escapeHtml(peers.map(p => p.name).join(', '))}
    </span>`;
}

/* Presence is only useful if it has a name to show, and a name nobody set is
   the default state. Ask for it once, inline, rather than behind Settings --
   but never block the page on it: a specialist who is already on a call can
   ignore this and lose nothing but the presence indicator. */
function renderNameGate(){
  const el = document.getElementById('nameGate');
  if (!el) return;
  if (!syncUrl || displayName){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="name-gate">
      ${icon('users','icon',14)}
      <span>Your name, so teammates can see which account you are in:</span>
      <input type="text" class="input" id="nameGateInput" placeholder="e.g. Dana R.">
      <button class="btn btn-primary compact" id="nameGateSave">Save</button>
    </div>`;
  const save = ()=>{
    const v = document.getElementById('nameGateInput').value.trim();
    if (!v) return;
    displayName = v;
    localStorage.setItem('hermetic:displayName', v);
    startHeartbeat();
    heartbeat();
    renderNameGate();
  };
  document.getElementById('nameGateSave').addEventListener('click', save);
  document.getElementById('nameGateInput').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') save();
  });
}

/* =================================================================
   INIT
================================================================= */
const DEFAULT_SETTINGS = { rootFolderName: "ONBOARDING - Custom Prompt Uploads", rootFolderId: "" };

/* What the account header calls this work. Deliberately not the Drive root
   name: that setting says where the files physically land, and the two are
   allowed to differ -- renaming the folder in Drive to match this would strand
   every file already uploaded under the old name. Settings still shows the real
   folder. */
const WORKSPACE_LABEL = 'ONBOARDING - Custom Instructions Creation';

function readTopLevelState(){
  state.accounts = readAccounts();
  state.settings = readSettings();
}

/* A pull brought someone else's work in. Repaint around whatever the person at
   this keyboard is doing: keep their caret where it was, and never overwrite
   the box they are typing in (their own keystrokes are newer than anything
   that just arrived, and are already queued to go up). */
function onRemoteChange(){
  readTopLevelState();
  if (state.currentAccountId && !state.accounts.some(a => a.id === state.currentAccountId)){
    state.currentAccountId = null;
  }
  renderSidebar();
  renderSyncPill();
  // Repainting now would tear out the progress bar of a file that is still
  // going up. The next poll picks the change up a few seconds later.
  if (busyUploads.size) return;
  renderMain({ preserveFocus: true, background: true });
}

/* Whatever is being typed outranks the repaint, whichever box it is in. The
   answer boxes are found again by item and field; everything else -- the new
   location name, the settings fields -- by id. Only the bound boxes used to be
   covered, so a poll landing mid-word emptied the new location box and took the
   caret with it, which made a name of any length impossible to finish typing. */
function focusSnapshot(){
  const el = document.activeElement;
  if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA' && el.tagName !== 'SELECT')) return null;
  const at = { value: el.value, start: el.selectionStart, end: el.selectionEnd, scrollTop: el.scrollTop };
  if (el.dataset && el.dataset.bind) return { ...at, item: el.dataset.item, bind: el.dataset.bind };
  if (el.id) return { ...at, id: el.id };
  return null;
}
function restoreFocus(snap){
  if (!snap) return;
  const el = snap.id
    ? document.getElementById(snap.id)
    : document.querySelector(`[data-item="${snap.item}"][data-bind="${snap.bind}"]`);
  if (!el) return;
  el.value = snap.value;       // keystrokes not yet flushed outrank the repaint
  el.focus();
  try{ el.setSelectionRange(snap.start, snap.end); }catch(e){}
  el.scrollTop = snap.scrollTop;
}

async function init(){
  document.getElementById('btnCollapse').innerHTML = icon('chevrons-left');
  document.getElementById('btnAddAccountTop').innerHTML = icon('plus') + '<span>Add account</span>';
  document.getElementById('btnAddAccountCollapsed').innerHTML = icon('plus');
  document.getElementById('btnSettings').innerHTML = icon('settings') + '<span>Settings</span>';

  // Anything the last session could not get up to the Sheet goes back in the
  // queue before anything else touches it.
  requeueDirty();

  // First paint comes straight out of the local mirror, with no network wait.
  migrateToRecords();
  stripRetiredFields();
  readTopLevelState();
  renderSyncPill();
  renderSidebar();
  renderMain();
  renderNameGate();

  if (!syncUrl) return;
  await startSync();
}

/* Everything that only makes sense once there is a Sheet to talk to. Split out
   of init because pasting the URL in Settings has to do exactly this too: it
   used to save the string and stop there, so until the page was reloaded
   nothing polled, nobody's presence showed, the schema was never published, and
   work already in this browser was never reconciled against the Sheet. The
   first person to set the tool up would not notice; the tenth would. */
async function startSync(){
  // Reconcile with the Sheet in one request. Migration runs again after it,
  // because the rows it needs to fold may only have arrived just now.
  const changed = await hydrate();
  migrateToRecords();
  stripRetiredFields();
  publishSchema();
  startPolling();
  startHeartbeat();
  startFileSweep();
  if (!changed) return;
  onRemoteChange();
}

/* =================================================================
   SIDEBAR
================================================================= */
function renderSidebar(){
  const list = document.getElementById('accountsList');
  if (state.accounts.length === 0){
    list.innerHTML = `<div class="nav-empty hide-collapsed">No accounts yet.</div>`;
    return;
  }
  list.innerHTML = state.accounts.map(acc => {
    const active = acc.id === state.currentAccountId ? 'active' : '';
    // Who is in each account, before you open it -- the cheapest way to stop
    // two specialists landing on the same customer.
    const peers = peersOn(acc.id);
    const who = peers.length ? `${peers.map(p => p.name).join(', ')} ${peers.length > 1 ? 'are' : 'is'} in here now` : '';
    return `<div class="nav-item ${active}" data-id="${acc.id}" title="${escapeAttr(acc.name + (who ? ' (' + who + ')' : ''))}">
      ${icon('building-2')}
      <span class="name hide-collapsed">${escapeHtml(acc.name)}</span>
      ${peers.length ? `<span class="peer-dot hide-collapsed" title="${escapeAttr(who)}">${escapeHtml(String(peers.length))}</span>` : ''}
      <button class="icon-btn nav-delete hide-collapsed" data-delete-account="${acc.id}" title="Delete ${escapeAttr(acc.name)}">${icon('trash-2','icon',14)}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=> selectAccount(el.dataset.id));
  });
  list.querySelectorAll('[data-delete-account]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();          // deleting is not also selecting
      confirmDeleteAccount(el.dataset.deleteAccount);
    });
  });
}

/* The most destructive thing in the tool: it takes every location under the
   account with it, for everyone, with no undo. Hence typing the name rather
   than a single click on a red button. */
async function confirmDeleteAccount(accountId){
  const account = readAccount(accountId);
  if (!account) return;
  const locations = readVenues(accountId);
  const peers = peersOn(accountId).filter(p => p.name);

  const ok = await confirmDialog({
    title: `Delete ${account.name}?`,
    body: `<p>This removes the account for everyone on the team, and it cannot be undone.</p>
      <ul>
        <li><strong>${locations.length === 0 ? 'No locations' : locations.length === 1 ? '1 location' : locations.length + ' locations'}</strong> will be deleted with it${locations.length ? `: ${escapeHtml(locations.map(l => l.name).join(', '))}` : ''}</li>
        <li>Every answer in ${locations.length === 1 ? 'it' : 'them'} goes too</li>
        <li>Files already in Google Drive are <strong>not</strong> deleted</li>
      </ul>
      ${peers.length ? `<p style="margin-top:var(--space-3);"><strong>${escapeHtml(peers.map(p => p.name).join(', '))}</strong> ${peers.length === 1 ? 'is' : 'are'} in this account right now.</p>` : ''}`,
    confirmLabel: 'Delete account',
    danger: true
  });
  if (!ok) return;

  deleteAccount(accountId);
  if (state.currentAccountId === accountId) state.currentAccountId = null;
  readTopLevelState();
  renderSidebar();
  heartbeat();                      // no longer in that account
  await renderMain();
}
async function selectAccount(id){
  state.currentAccountId = id;
  renderSidebar();
  heartbeat();            // tell everyone else where this browser went
  await renderMain();
}
document.getElementById('btnCollapse').addEventListener('click', ()=>{
  state.sidebarCollapsed = !state.sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', state.sidebarCollapsed);
  document.getElementById('btnCollapse').innerHTML = icon(state.sidebarCollapsed ? 'chevrons-right' : 'chevrons-left');
});
function openNewAccountRow(){
  if (state.sidebarCollapsed){
    state.sidebarCollapsed = false;
    document.getElementById('sidebar').classList.remove('collapsed');
    document.getElementById('btnCollapse').innerHTML = icon('chevrons-left');
  }
  document.getElementById('newAccountRow').style.display = 'block';
  document.getElementById('newAccountInput').focus();
}
document.getElementById('btnAddAccountTop').addEventListener('click', ()=>{
  const row = document.getElementById('newAccountRow');

/* =================================================================
   MAIN RENDER
================================================================= */
function skeletonList(rows){
  const card = `<div class="skeleton-card"><span class="shimmer sq"></span><span class="shimmer" style="flex:1; max-width:220px;"></span></div>`;
  return `<div class="skeleton">${card.repeat(rows || 3)}</div>`;
}

/* init() renders once from the mirror and again if hydrate() brought
   something new, and selectAccount() can land in between. The generation
   counter keeps a slower earlier pass from painting over a newer one. */
let renderGeneration = 0;

async function renderMain(opts){
  // A pull landing while someone is in Settings used to throw them back to the
  // location list mid-sentence. Anything the person did not ask for says so,
  // and gets to be ignored; navigating here is still always honoured.
  if (opts && opts.background && state.view !== 'main') return;
  state.view = 'main';
  const generation = ++renderGeneration;
  const content = document.getElementById('content');
  const title = document.getElementById('pageTitle');
  const meta = document.getElementById('pageMeta');

  // A repaint driven by someone else's change must not move the caret of the
  // person typing here, nor replace what they have typed since the last flush.
  const snap = (opts && opts.preserveFocus) ? focusSnapshot() : null;

  if (!state.currentAccountId){
    title.textContent = 'Accounts';
    meta.textContent = 'Add an account to set up locations for Mia.';
    content.innerHTML = `<div class="empty-state">${icon('building-2','icon-lg')}<div class="t-title">No account selected</div><div class="t-body">Add your first account on the left to start setting up locations.</div></div>`;
    renderPresence();
    return;
  }

  const account = readAccount(state.currentAccountId);
  if (!account){
    // Deleted out from under us by a teammate.
    state.currentAccountId = null;
    renderSidebar();
    return renderMain();
  }
  title.textContent = account.name;
  meta.innerHTML = `<span class="mono" style="font-size:11.5px;">${escapeHtml(WORKSPACE_LABEL)} - ${escapeHtml(account.name)}</span>`;

  // Only an account the mirror knows nothing about waits on the network. A
  // returning browser paints its cached answers immediately and lets the pull
  // catch it up a moment later.
  if (!kvHydrated && syncUrl && !localKeys(`hermetic:venue:${account.id}:`).length){
    content.innerHTML = skeletonList();
    await hydrate();
    if (generation !== renderGeneration) return;   // a newer render took over
  }

  const venues = readVenues(account.id);

  content.innerHTML = `<div id="venueList"></div>`;
  const listEl = document.getElementById('venueList');
  listEl.innerHTML = renderVenuesList(venues);
  wireVenuesList(account, venues);
  renderPresence();
  restoreFocus(snap);
}

function renderVenuesList(items){
  const addRow = `<div class="inline-add">
      <input type="text" class="input" id="newVenueInput" placeholder="New location name">
      <button class="btn btn-primary" id="btnAddVenue">${icon('plus')}Add location</button>
    </div>`;
  if (items.length === 0){
    return addRow + `<div class="empty-state">${icon('map-pin','icon-lg')}<div class="t-title">No locations yet</div><div class="t-body">Add one above. Each location holds the facts and the behavior together, and produces both documents Mia needs.</div></div>`;
  }
  return addRow + items.map(item => renderVenue(item)).join('');
}

function renderSchemaSection(itemId, data, sec){
  if (sec.type !== 'block') return '';
  const outline = (sec.hint || []).map(h => `<li>${escapeHtml(h)}</li>`).join('');
  return `<div class="subsection">
      <div class="t-overline">${escapeHtml(sec.title)}</div>
      ${outline ? `<ul class="outline">${outline}</ul>` : ''}
      <textarea class="input block-input" data-item="${itemId}" data-bind="${sec.key}" placeholder="${escapeAttr(sec.placeholder || '')}">${escapeHtml(getAtPath(data, sec.key) || '')}</textarea>
    </div>`;
}

/* A file chip says what Drive currently reports about the file, not only what
   it was called when it was uploaded. A file that is gone stops being a link:
   offering one that leads nowhere is worse than saying plainly that it went. */
function renderDocChip(itemId, d, i){
  const category = escapeHtml(d.category || 'Other');
  const label = `<span class="badge badge-slate" style="height:18px; padding:0 6px; font-size:11px;">${category}</span>`;
  const remove = `<button class="icon-btn" style="width:18px;height:18px;" data-remove-doc="${itemId}" data-index="${i}" title="Remove from this list">${icon('x','icon',12)}</button>`;

  if (d.gone){
    const what = d.gone === 'trashed'
      ? { text: 'In Drive trash', hint: 'This file is in the Google Drive trash. Restore it in Drive, or remove it from this list.' }
      : { text: 'Deleted from Drive', hint: 'This file is no longer in Google Drive. Upload it again, or remove it from this list.' };
    return `<span class="doc-chip gone" title="${escapeAttr(what.hint)}">${icon('alert-triangle','icon',12)}${label}<span class="mono doc-gone-name">${escapeHtml(d.name)}</span><span class="badge badge-destructive" style="height:18px; padding:0 6px; font-size:11px;">${what.text}</span>${remove}</span>`;
  }

  // Filed under something other than its category means somebody moved it.
  const moved = d.folderName && d.folderName !== (d.category || 'Other')
    ? `<span class="doc-moved" title="Moved in Google Drive">in ${escapeHtml(d.folderName)}</span>` : '';
  return `<span class="doc-chip">${icon('paperclip','icon',12)}${label}<a href="${escapeAttr(d.link||'#')}" target="_blank" rel="noopener" class="mono">${escapeHtml(d.name)}</a>${moved}${remove}</span>`;
}

    </div>
    <div class="card-body">

        <div class="upload-row">

function banner(type, iconName, message, spin){
