/* =================================================================
   SERIALIZATION for "Copy for Claude"
================================================================= */
function serializePart(schema, data){
  const out = [];
  for (const sec of schema){
    if (sec.type === 'block'){
      const v = (getAtPath(data, sec.key) || '').trim();
      out.push(`${sec.title}:\n` + (v || 'None.'));
    } else if (sec.type === 'section'){
      const lines = sec.fields.map(f => { const v = (getAtPath(data,f.path)||'').trim(); return v ? `${f.label}: ${v}` : null; }).filter(Boolean);
      out.push(`${sec.title}:\n` + (lines.length ? lines.join('\n') : 'None.'));
    } else if (sec.type === 'list'){
      const arr = (getAtPath(data, sec.key) || []).map(v => (v||'').trim()).filter(Boolean);
      out.push(`${sec.title}:\n` + (arr.length ? arr.map(v=>`- ${v}`).join('\n') : 'None.'));
    } else if (sec.type === 'group'){
      const arr = getAtPath(data, sec.key) || [];
      const rows = arr.filter(row => sec.fields.some(f => (row[f.path]||'').trim()));
      if (!rows.length){ out.push(`${sec.title}:\nNone.`); continue; }
      const rowTexts = rows.map(row => sec.fields.map(f => { const v=(row[f.path]||'').trim(); return v?`${f.label}: ${v}`:null; }).filter(Boolean).join('\n'));
      out.push(`${sec.title}:\n` + rowTexts.map((t,i)=>`${sec.itemLabel} ${i+1}:\n${t}`).join('\n\n'));
    }
  }
  return out.join('\n\n');
}

/* Rooms, pricing, menus, policies and FAQs come from the files now, but a
   venue set up before that change may still hold typed rows. Pass those along
   rather than dropping facts on the floor. */
function serializeCarriedOver(data){
  const kept = FILE_SOURCED_SECTIONS.filter(sec =>
    (getAtPath(data, sec.key) || []).some(row => sec.fields.some(f => (row[f.path]||'').trim())));
  return kept.length ? serializePart(kept, data) : '';
}

async function copyForClaude(account, item){
  const facts = serializePart(LOCATION_SCHEMA, item.data);
  const carried = serializeCarriedOver(item.data);
  const behavior = serializePart(CAMPAIGN_SCHEMA, item.data);
  const docs = item.data.docs || [];
  const fileList = docs.length
    ? docs.map(d => `- ${d.category || 'Other'}: ${d.name}${d.link ? ` (${d.link})` : ''}`).join('\n')
    : 'None uploaded in the console.';
  /* Everything above the divider is the skill, unchanged. Everything below is
     only this location's material and which of the skill's three cases applies.
     The console always collects a location and its campaign together, so that
     is always the "both together" case, and the skill fixes the order for it:
     Campaign Instructions, then Location Details, then one combined Open
     Questions list. */
  const text = `${SKILL_TEXT}

---

ACCOUNT: ${account.name}
LOCATION: ${item.name}

CLIENT FILES (attached to this chat):

${fileList}

How to use these sources: ${FILE_SOURCED_LABEL} are not collected in the console at all. Take them from the attached files and structure them yourself against the Location Details template. The answers below cover everything else; each heading holds one free-form note, so read it for the facts it contains rather than expecting a fixed field order, and treat an empty one as "nothing special here." Where a typed answer below and a file disagree, the typed answer wins. Anything still missing, unconfirmed, or contradictory goes in Open Questions, never into the documents.

COLLECTED ANSWERS: LOCATION FACTS (for Location Details):

${facts}
${carried ? `\nFACTS TYPED IN BEFORE THESE SECTIONS MOVED TO FILE UPLOAD. Treat them as typed answers:\n\n${carried}\n` : ''}

COLLECTED ANSWERS: ASSISTANT BEHAVIOR (for Campaign Instructions):

${behavior}

---

This material covers one location and its campaign together.`;
  await navigator.clipboard.writeText(text);
}

/* =================================================================
   DUPLICATE VENUE

   A chain is the common case: fill one venue in, duplicate it for the
   other four, change what differs. The copy is a first-class new
   record with its own Drive folder and its own files, so editing or
   deleting anything in it never reaches back into the venue it came
   from.
================================================================= */
const onModalKey = (e) => { if (e.key === 'Escape') closeModal(); };
let onModalClose = null;

function closeModal(){
  const root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
  document.removeEventListener('keydown', onModalKey);
  // Escape and the overlay are dismissals too, not just the Cancel button, so
  // whatever opened the modal has to hear about every way out of it.
  const notify = onModalClose;
  onModalClose = null;
  if (notify) notify();
}
function openModal(html, onClose){
  onModalClose = onClose || null;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" data-overlay><div class="modal">${html}</div></div>`;
  document.addEventListener('keydown', onModalKey);
  root.querySelector('[data-overlay]').addEventListener('click', (e)=>{
    if (e.target.hasAttribute('data-overlay')) closeModal();
  });
}

/* =================================================================
   CONFIRMING

   The tool's own confirm, resolving true or false.

   A browser confirm() is the wrong thing here on two counts: it is
   chrome, not the tool, so on a live call it reads like the page has
   broken; and it cannot show the name of what is about to go, or what
   goes with it, which is the most useful thing a delete prompt can
   say.
================================================================= */
function confirmDialog({ title, body, confirmLabel, cancelLabel, danger }){
  return new Promise(resolve => {
    let settled = false;
    const finish = (value) => { if (!settled){ settled = true; resolve(value); } };

    openModal(`
      <div class="t-title" style="margin-bottom:var(--space-3);">${escapeHtml(title)}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel">${escapeHtml(cancelLabel || 'Cancel')}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirmGo">${escapeHtml(confirmLabel || 'Confirm')}</button>
      </div>`, () => finish(false));

    document.getElementById('confirmGo').addEventListener('click', ()=>{ finish(true); closeModal(); });
    document.getElementById('confirmCancel').addEventListener('click', closeModal);

    // Focus starts on Cancel. Confirming is one click, so a stray Enter or
    // Space carried over from whatever was focused before must not be it.
    document.getElementById('confirmCancel').focus();
  });
}

function openDuplicateDialog(account, item){
  const docs = (item.data.docs || []);
  const copyable = docs.filter(d => d.fileId).length;
  // A deployment without copyFile_ would answer "Unknown action", which is a
  // worse way to find out than the checkbox simply saying so.
  // serverVersion is 0 until the first pull answers. Unknown is not the same as
  // old: let the attempt through and report per-file failures if it turns out
  // the deployment cannot copy, rather than greying out a button that works.
  const canCopyFiles = !!syncUrl && copyable > 0 && (serverVersion === 0 || serverVersion >= 4);
  const staleBackend = !!syncUrl && copyable > 0 && serverVersion > 0 && serverVersion < 4;

  openModal(`
    <div class="t-title" style="margin-bottom:var(--space-4);">Duplicate location</div>
    <div class="field">
      <label>New location name</label>
      <input type="text" class="input" id="dupName" value="${escapeAttr(item.name + ' (copy)')}">
    </div>
    ${docs.length ? `<div class="field">
      <label class="modal-check">
        <input type="checkbox" id="dupFiles"${canCopyFiles ? '' : ' disabled'}>
        <span>Copy the ${docs.length === 1 ? 'uploaded file' : docs.length + ' uploaded files'} into the new location's Drive folder${
          staleBackend ? ' (not available until the connection is updated)' :
          (!syncUrl ? ' (needs a connection first)' :
          (copyable ? '' : ' (these files were added before uploads and cannot be copied)'))
        }</span>
      </label>
    </div>` : ''}
    <div id="dupStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dupCancel">Cancel</button>
      <button class="btn btn-primary" id="dupGo">${icon('copy-plus')}Duplicate</button>
    </div>`);

  const nameEl = document.getElementById('dupName');
  nameEl.focus();
  nameEl.setSelectionRange(0, nameEl.value.length);

  document.getElementById('dupCancel').addEventListener('click', closeModal);
  nameEl.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') document.getElementById('dupGo').click(); });

  document.getElementById('dupGo').addEventListener('click', async ()=>{
    const statusEl = document.getElementById('dupStatus');
    const goEl = document.getElementById('dupGo');
    const name = nameEl.value.trim();
    if (!name){ statusEl.innerHTML = banner('destructive','alert-triangle','Give the new location a name.'); return; }

    // The copy belongs to the account being looked at. Moving a location
    // between accounts is a different job from duplicating one, and offering
    // both on the same button only made it easy to file a copy somewhere
    // nobody expected to find it.
    const targetId = account.id;
    const targetAccount = readAccount(targetId);
    if (!targetAccount){ statusEl.innerHTML = banner('destructive','alert-triangle','That account is no longer there.'); return; }

    const wantFiles = !!(document.getElementById('dupFiles') || {}).checked;
    goEl.disabled = true;
    document.getElementById('dupCancel').disabled = true;

    const record = duplicateVenueRecord(account.id, item.id, targetId, name);
    if (!record){
      statusEl.innerHTML = banner('destructive','alert-triangle','This location was removed by a teammate.');
      return;
    }

    let failed = 0;
    if (wantFiles && docs.length){
      // Server-side copies have no measurable length of their own, so the bar
      // counts files: it is the one thing here that genuinely has a total.
      statusEl.innerHTML = `<div class="upload-progress" style="height:auto; margin-top:var(--space-3);">
          <div class="upload-progress-head">
            <span class="upload-progress-name" id="dupProgressName">Starting…</span>
            <span class="upload-progress-pct" id="dupProgressPct"></span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="dupProgressFill"></div></div>
        </div>`;
      const nameEl2 = document.getElementById('dupProgressName');
      const pctEl = document.getElementById('dupProgressPct');
      const fillEl = document.getElementById('dupProgressFill');
      for (let i = 0; i < docs.length; i++){
        const doc = docs[i];
        if (nameEl2) nameEl2.textContent = `Copying ${doc.name}`;
        if (pctEl) pctEl.textContent = `${i + 1} of ${docs.length}`;
        if (fillEl) fillEl.style.width = Math.round((i / docs.length) * 100) + '%';
        try{
          // Each file is saved onto the record as it lands rather than all at
          // the end, so a copy that fails half way through still leaves the
          // duplicate holding every file that did make it.
          if (doc.fileId){
            const result = await copyDocumentInDrive({
              segments: [targetAccount.name, name],
              category: doc.category || 'Other',
              fileId: doc.fileId,
              filename: doc.name
            });
            attachDoc(targetId, record.id, { name: doc.name, link: result.link, category: doc.category || 'Other', fileId: result.fileId }, result.folderLink);
          }else{
            // Nothing to copy in Drive -- carry the link across as a reference.
            attachDoc(targetId, record.id, { ...doc }, '');
          }
        }catch(err){
          failed++;
          console.warn('Could not copy', doc.name, err);
        }
      }
      if (fillEl) fillEl.style.width = '100%';
    }

    closeModal();
    state.currentAccountId = targetId;
    state.openItemIds.add(record.id);
    readTopLevelState();
    renderSidebar();
    heartbeat();
    await renderMain();

    if (failed){
      const el = document.querySelector(`[data-upload-status="${record.id}"]`);
      if (el) el.innerHTML = banner('destructive','alert-triangle',
        `${failed} of ${docs.length} file${docs.length === 1 ? '' : 's'} could not be copied. Everything else came across. Upload the rest by hand.`);
    }
  });
}

/* Appends one file to a venue and saves immediately. Goes through editVenue so
   the record is re-read first: a duplicate with several files takes seconds,
   and a teammate may well have touched the venue in between. */
function attachDoc(accountId, venueId, doc, folderLink){
  editVenue(accountId, venueId, (record)=>{
    record.data.docs = record.data.docs || [];
    record.data.docs.push(doc);
    if (folderLink && !record.data.drive_link) record.data.drive_link = folderLink;
    return ['data.docs', 'data.drive_link'];
  });
}

/* =================================================================
   WIRING

   Every handler re-reads its venue from the mirror before changing it
   rather than mutating the object the render happened to paint from.
   That object can be seconds stale -- a pull may have landed while a
   card sat open -- and writing it back whole would undo whatever the
   pull brought. Read, change one field, stamp it, save.
================================================================= */
const FIELD_DEBOUNCE_MS = 600;

/* Locations with a file going up right now. An upload owns DOM that a repaint
   would destroy mid-flight, taking the indicator with it while the request
   carried on invisibly, so a pull that lands during one holds its repaint back
   until it is done. */
const busyUploads = new Set();

/* Files chosen but not yet uploaded, by location. Kept outside the DOM because
   a re-render replaces the file input and takes the selection with it. */
const pendingFiles = new Map();
/* The category a person picked, held outside the DOM for the same reason the
   chosen file is. The card is rebuilt on every poll, every Drive check and
   every other card opening, and each rebuild made a fresh <select> sitting on
   its first option -- so picking "Pricing doc/matrix" and then pausing for a
   moment quietly put it back to "Menu", and the file went up filed as a menu.
   It is deliberately not cleared after an upload: several files of the same
   kind in a row is the normal case. */
const pendingCategory = new Map();     // venue id -> category chosen for the next upload

function wireVenuesList(account, items){
  const addBtn = document.getElementById('btnAddVenue');
  if (addBtn){
    addBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newVenueInput');
      const name = input.value.trim();
      if (!name) return;
      const record = createVenue(account.id, name);
      input.value = '';
      state.openItemIds.add(record.id);
      await renderMain();
    });
  }

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggle;
      if (state.openItemIds.has(id)) state.openItemIds.delete(id); else state.openItemIds.add(id);
      renderMain();
    });
  });

  document.querySelectorAll('[data-duplicate]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      // Read fresh rather than trusting the painted copy: the card may have
      // been open a while, and the duplicate should carry the current answers.
      const item = readVenue(account.id, el.dataset.duplicate);
      if (!item) return;
      openDuplicateDialog(account, item);
    });
  });

  document.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = el.dataset.delete;
      const item = readVenue(account.id, id);
      if (!item) return;
      const fileCount = (item.data.docs || []).length;
      const ok = await confirmDialog({
        title: `Delete ${item.name}?`,
        body: `<p>This removes the location for everyone on the team, and it cannot be undone.</p>
          <ul>
            <li>Every answer typed into it goes</li>
            <li>${fileCount ? `The ${fileCount === 1 ? 'file' : fileCount + ' files'} uploaded here stay in Google Drive` : 'Nothing in Google Drive is affected'}</li>
          </ul>`,
        confirmLabel: 'Delete location',
        danger: true
      });
      if (!ok) return;
      // A tombstone, not a removed row: the Sheet has no delete, and a reader
      // cannot tell a row that was deleted from one it has not seen yet.
      deleteVenue(account.id, id);
      await renderMain();
    });
  });

  /* Typed text is committed on a short debounce rather than on blur. On a call
     the tab gets closed with the caret still in a box, and a field that only
     saved on blur was a field that never saved at all. It also means a repaint
     from someone else's change is never more than a moment away from having
     this person's latest keystrokes in it. */
  const timers = new Map();
  const commit = (el) => {
    const itemId = el.dataset.item;
    setVenueField(account.id, itemId, el.dataset.bind, el.value);
  };
  document.querySelectorAll('[data-bind]').forEach(el=>{
    const key = el.dataset.item + ':' + el.dataset.bind;
    el.addEventListener('input', ()=>{
      clearTimeout(timers.get(key));
      timers.set(key, setTimeout(()=> commit(el), FIELD_DEBOUNCE_MS));
    });
    el.addEventListener('blur', ()=>{
      clearTimeout(timers.get(key));
      commit(el);
    });
  });

  /* The real input is visually hidden, so the row itself has to report what was
     picked, and it has to keep reporting it. The card is rebuilt whenever a poll
     brings something in, whenever Drive is checked, and whenever another card is
     opened -- and every rebuild makes a brand new empty <input type="file">. A
     file chosen a moment before any of that simply vanished, with the row back
     to "Choose a file" and no sign anything had happened. So the File itself is
     held in pendingFiles, outside the DOM, and the input is refilled from it
     after each render. */
  const showChosenFile = (itemId) => {
    const picker = document.querySelector(`[data-picker-for="${itemId}"]`);
    const clear = document.querySelector(`[data-clear-file="${itemId}"]`);
    if (!picker) return;
    const file = pendingFiles.get(itemId);
    picker.querySelector('.file-name').textContent = file ? file.name : 'Choose a file';
    picker.classList.toggle('has-file', !!file);
    if (clear) clear.hidden = !file;
  };

  const restoreChosenFile = (itemId) => {
    const input = document.getElementById(`docFile-${itemId}`);
    const file = pendingFiles.get(itemId);
    if (input && file){
      // Put the File back into the fresh input so the native control agrees
      // with what the row says. DataTransfer is the only way to assign it.
      try{
        const carrier = new DataTransfer();
        carrier.items.add(file);
        input.files = carrier.files;
      }catch(e){ /* older browser: pendingFiles is still the source of truth */ }
    }
    showChosenFile(itemId);
  };

  document.querySelectorAll('[data-category-for]').forEach(el=>{
    el.addEventListener('change', ()=> pendingCategory.set(el.dataset.categoryFor, el.value));
  });

  document.querySelectorAll('[data-file-for]').forEach(el=>{
    const itemId = el.dataset.fileFor;
    el.addEventListener('change', ()=>{
      const chosen = el.files && el.files[0];
      if (chosen) pendingFiles.set(itemId, chosen); else pendingFiles.delete(itemId);
      showChosenFile(itemId);
    });
    restoreChosenFile(itemId);       // survive the render that just happened
  });

  document.querySelectorAll('[data-clear-file]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      const itemId = el.dataset.clearFile;
      pendingFiles.delete(itemId);
      const input = document.getElementById(`docFile-${itemId}`);
      if (input) input.value = '';
      showChosenFile(itemId);
    });
  });

  /* Drives the indicator for one location's upload: the picker gives way to a
     progress bar, and every control that could start a second upload or change
     where this one is going is locked until it finishes. */
  function uploadIndicator(itemId){
    const picker   = document.querySelector(`[data-picker-for="${itemId}"]`);
    const clear    = document.querySelector(`[data-clear-file="${itemId}"]`);
    const progress = document.querySelector(`[data-progress-for="${itemId}"]`);
    const button   = document.querySelector(`[data-upload-doc="${itemId}"]`);
    const category = document.getElementById(`docCategory-${itemId}`);
    const input    = document.getElementById(`docFile-${itemId}`);
    const label    = progress && progress.querySelector('[data-progress-label]');
    const pct      = progress && progress.querySelector('[data-progress-pct]');
    const fill     = progress && progress.querySelector('[data-progress-fill]');
    const buttonWas = button && button.innerHTML;
    let elapsedTimer = null;

    return {
      start(filename){
        clearInterval(elapsedTimer);
        busyUploads.add(itemId);
        if (picker) picker.hidden = true;
        if (clear) clear.hidden = true;
        if (progress) progress.hidden = false;
        if (label) label.textContent = filename;
        if (pct) pct.textContent = '';
        if (fill){ fill.style.width = '0%'; fill.classList.remove('indeterminate'); }
        [button, category, input].forEach(c => { if (c) c.disabled = true; });
        if (button) button.innerHTML = icon('loader-2','icon spin') + 'Uploading…';
      },
      phase(name, fraction){
        if (!fill) return;
        if (name === 'reading'){
          // Measurable, so show the real number.
          fill.classList.remove('indeterminate');
          const percent = Math.round((fraction || 0) * 100);
          fill.style.width = percent + '%';
          if (pct) pct.textContent = 'Reading ' + percent + '%';
          return;
        }
        // On its way to Drive. Nothing here can be measured (see
        // uploadDocumentToDrive), so the bar moves without claiming a number and
        // a running clock shows the request has not died.
        fill.classList.add('indeterminate');
        const startedAt = Date.now();
        const tick = ()=>{
          if (!pct) return;
          pct.textContent = 'Sending… ' + Math.round((Date.now() - startedAt) / 1000) + 's';
        };
        tick();
        clearInterval(elapsedTimer);
        elapsedTimer = setInterval(tick, 1000);
      },
      stop(){
        clearInterval(elapsedTimer);
        busyUploads.delete(itemId);
        if (picker) picker.hidden = false;
        if (progress) progress.hidden = true;
        // Only back if the file is still sitting there, which it is after a
        // failure and is not after a success.
        if (clear) clear.hidden = !pendingFiles.has(itemId);
        [button, category, input].forEach(c => { if (c) c.disabled = false; });
        if (button && buttonWas) button.innerHTML = buttonWas;
      }
    };
  }

  document.querySelectorAll('[data-upload-doc]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const itemId = el.dataset.uploadDoc;
      if (busyUploads.has(itemId)) return;        // already going up
      const item = readVenue(account.id, itemId);
      const fileEl = document.getElementById(`docFile-${itemId}`);
      const categoryEl = document.getElementById(`docCategory-${itemId}`);
      const statusEl = document.querySelector(`[data-upload-status="${itemId}"]`);
      const file = pendingFiles.get(itemId) || (fileEl.files && fileEl.files[0]);
      if (!item){ statusEl.innerHTML = banner('destructive','alert-triangle','This location was removed by a teammate.'); return; }
      if (!file){ statusEl.innerHTML = banner('destructive','alert-triangle','Choose a file first.'); return; }
      if (file.size > 8 * 1024 * 1024){
        statusEl.innerHTML = banner('destructive','alert-triangle','File is over 8MB. Upload it to Drive manually and paste the link into a note instead.');
        return;
      }
      const ui = uploadIndicator(itemId);
      ui.start(file.name);
      statusEl.innerHTML = '';
      try{
        const result = await uploadDocumentToDrive({
          segments: [account.name, item.name], category: categoryEl.value, file,
          onPhase: (name, fraction)=> ui.phase(name, fraction)
        });
        // Re-read: the upload took seconds, and a teammate may have uploaded
        // into the same venue meanwhile. Files merge as a union, so appending
        // to the current record keeps both.
        editVenue(account.id, itemId, (record)=>{
          record.data.docs = record.data.docs || [];
          record.data.docs.push({ name: file.name, link: result.link, category: categoryEl.value, fileId: result.fileId });
          if (result.folderLink) record.data.drive_link = result.folderLink;
          return ['data.docs', 'data.drive_link'];
        });
        ui.stop();
        pendingFiles.delete(itemId);
        fileEl.value = '';
        showChosenFile(itemId);
        state.openItemIds.add(itemId);
        await renderMain();
      }catch(err){
        ui.stop();
        statusEl.innerHTML = banner('destructive','alert-triangle','Upload failed: ' + err.message);
      }
    });
  });

  // Ask Drive about the files of every card that is actually open. Closed cards
  // are not worth a round trip on a backend that runs requests one at a time.
  items.forEach(item => {
    if (state.openItemIds.has(item.id)) verifyLocationFiles(account.id, item.id);
  });

  document.querySelectorAll('[data-recheck-files]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const itemId = el.dataset.recheckFiles;
      el.innerHTML = icon('loader-2','icon spin',13);
      await verifyLocationFiles(account.id, itemId, { force: true });
      const still = document.querySelector(`[data-recheck-files="${itemId}"]`);
      if (still) still.innerHTML = icon('refresh-cw','icon',13);
    });
  });

  document.querySelectorAll('[data-remove-doc]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const itemId = el.dataset.removeDoc;
      const index = parseInt(el.dataset.index, 10);
      editVenue(account.id, itemId, (record)=>{
        const doc = (record.data.docs || [])[index];
        if (!doc) return [];
        record.data.docs.splice(index, 1);
        // Remember the removal by id. Without this the next merge would see
        // the file on the other side and cheerfully put it back.
        record.docsRemoved = record.docsRemoved || [];
        const k = docKeyOf(doc);
        if (k && !record.docsRemoved.includes(k)) record.docsRemoved.push(k);
        return ['data.docs'];
      });
      state.openItemIds.add(itemId);
      await renderMain();
    });
  });

  document.querySelectorAll('[data-copy-claude]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const item = readVenue(account.id, el.dataset.copyClaude);
      if (!item) return;
      try{
        await copyForClaude(account, item);
        // Only a copy that actually reached the clipboard clears the badge.
        markVenueCopied(account.id, item.id);
        await renderMain({ preserveFocus: true });
        const again = document.querySelector(`[data-copy-claude="${item.id}"]`);
        if (again){
          again.innerHTML = icon('check-circle') + 'Copied';
          setTimeout(()=>{ again.innerHTML = icon('copy') + 'Copy for Claude'; }, 1500);
        }
      }catch(e){ alert('Could not copy: ' + e.message); }
    });
  });

}

/* =================================================================
   SETTINGS
================================================================= */
document.getElementById('btnSettings').addEventListener('click', renderSettings);

function renderSettings(){
  state.view = 'settings';
  const content = document.getElementById('content');
  document.getElementById('pageTitle').textContent = 'Settings';
  document.getElementById('pageMeta').textContent = 'Sync, Drive naming, and backup for your whole team.';

  content.innerHTML = `
    <button class="btn btn-ghost compact" id="btnBackFromSettings" style="margin-bottom:var(--space-5);">${icon('arrow-left')}Back</button>
    <div class="settings-grid">
      <div class="card" style="padding:var(--space-6);">
        <div class="t-title" style="margin-bottom:var(--space-3);">Your name</div>
        <div class="field">
          <label>Shown to teammates</label>
          <input type="text" class="input" id="displayNameInput" value="${escapeAttr(displayName)}" placeholder="e.g. Dana R.">
          <div class="t-caption" style="margin-top:var(--space-1);">Whoever else has an account open sees this, so two of you do not end up on the same customer. Stored in this browser only.</div>
        </div>
        <button class="btn btn-primary" id="btnSaveName">Save</button>
        <span id="nameSaveStatus"></span>
      </div>

      <div class="card" style="padding:var(--space-6);">
        <div class="t-title" style="margin-bottom:var(--space-3);">Google Sheet sync</div>
        <div class="field">
          <label>Apps Script web app URL</label>
          <input type="text" class="input" id="syncUrlInput" value="${escapeAttr(syncUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
          <div class="t-caption" style="margin-top:var(--space-1);">Without this, data is saved to this browser only.</div>
        </div>
        <div class="row-actions" style="display:flex; gap:var(--space-2);">
          <button class="btn btn-outline" id="btnSaveSyncUrl">Save</button>
          <button class="btn btn-ghost" id="btnTestSync">Test connection</button>
        </div>
        <div id="syncTestStatus"></div>
      </div>

      <div class="card" style="padding:var(--space-6);">
        <div class="t-title" style="margin-bottom:var(--space-3);">Drive uploads</div>
        <div class="field">
          <label>Root Drive folder (URL or ID)</label>
          <input type="text" class="input" id="rootFolderIdInput" value="${escapeAttr(state.settings.rootFolderId||'')}" placeholder="https://drive.google.com/drive/folders/...">
          <div class="t-caption" style="margin-top:var(--space-1);">Files upload into this folder, organized by account and location automatically. Leave blank to let the Apps Script create a top-level folder by name instead.</div>
        </div>
        <div class="field">
          <label>Root folder name</label>
          <input type="text" class="input" id="rootFolderInput" value="${escapeAttr(state.settings.rootFolderName)}">
          <div class="t-caption" style="margin-top:var(--space-1);">Used only when no folder ID is set above.</div>
        </div>
        <button class="btn btn-primary" id="saveFolderBtn">Save</button>
        <span id="folderSaveStatus"></span>
      </div>

      <div class="card" style="padding:var(--space-6);">
        <div class="t-title" style="margin-bottom:var(--space-3);">Backup</div>
        <div class="t-caption" style="margin-bottom:var(--space-3);">Export everything as a JSON file, or restore from one.</div>
        <div class="row-actions" style="display:flex; gap:var(--space-2);">
          <button class="btn btn-outline" id="btnExport">${icon('download')}Export JSON</button>
          <button class="btn btn-outline" id="btnImportTrigger">${icon('upload')}Import JSON</button>
          <input type="file" id="importFile" accept="application/json" style="display:none;">
        </div>
        <div id="importStatus"></div>
      </div>
    </div>`;

  document.getElementById('btnBackFromSettings').addEventListener('click', renderMain);

  document.getElementById('btnSaveName').addEventListener('click', ()=>{
    displayName = document.getElementById('displayNameInput').value.trim();
    localStorage.setItem('hermetic:displayName', displayName);
    document.getElementById('nameSaveStatus').innerHTML = banner('success','check-circle','Saved.');
    startHeartbeat();
    heartbeat();
    renderNameGate();
  });

  document.getElementById('btnSaveSyncUrl').addEventListener('click', async ()=>{
    const previous = syncUrl;
    syncUrl = document.getElementById('syncUrlInput').value.trim();
    localStorage.setItem('hermetic:syncUrl', syncUrl);
    renderSyncPill();
    if (!syncUrl || syncUrl === previous){
      document.getElementById('syncTestStatus').innerHTML = banner('success','check-circle','Saved. Click "Test connection" to verify it works.');
      return;
    }
    // A URL pasted into a browser that has been used offline is the moment its
    // accounts and locations finally have somewhere to go. hydrate() sends them.
    document.getElementById('syncTestStatus').innerHTML = banner('info','loader-2','Saved. Catching up with the Sheet…', true);
    kvHydrating = null;
    kvHydrated = false;
    lastPullAt = 0;
    await startSync();
    document.getElementById('syncTestStatus').innerHTML = banner('success','check-circle','Saved and connected. Click "Test connection" if you want the details.');
  });
  document.getElementById('btnTestSync').addEventListener('click', async ()=>{
    const url = document.getElementById('syncUrlInput').value.trim();
    const statusEl = document.getElementById('syncTestStatus');
    if (!url){ statusEl.innerHTML = banner('destructive','alert-triangle','Paste a URL first.'); return; }
    statusEl.innerHTML = banner('info','loader-2','Testing…', true);
    const result = await testSyncConnection(url);
    /* Four outcomes, said plainly. The point of each is what the person in
       front of it can expect to happen to their work, not which part of the
       backend is out of date. */
    statusEl.innerHTML = !result.ok
      ? banner('destructive','alert-triangle','Not connected. Check the link is right and that it was shared with everyone, then try again.')
      : result.serverVersion < 3 || !result.batch
        ? banner('destructive','alert-triangle','Connected, but out of date. Until it is updated, two people working on the same location at the same time can overwrite each other. Ask whoever set this up to update it.')
        : result.serverVersion < 4
          ? banner('info','alert-triangle','Connected. One thing is missing: duplicating a location will not bring its files across until this is updated.')
          : result.serverVersion < 5
            ? banner('info','alert-triangle','Connected. Two things are missing until this is updated: the console will not notice files renamed or deleted in Google Drive, and edits typed straight into the Google Sheet will not show up here.')
            : result.serverVersion < 8
              ? banner('info','alert-triangle','Connected. One thing is missing: the readable tabs in the Google Sheet stop updating themselves after a while and have to be refreshed by hand, until this is updated.')
              : banner('success','check-circle','Connected. Everything is saving, your team can work at the same time, the Google Sheet keeps a readable copy up to date, and changes made in Google Drive or the Sheet show up here.');
  });

  document.getElementById('saveFolderBtn').addEventListener('click', async ()=>{
    saveSettings({
      rootFolderId: document.getElementById('rootFolderIdInput').value.trim(),
      rootFolderName: document.getElementById('rootFolderInput').value.trim() || 'ONBOARDING - Custom Prompt Uploads'
    });
    document.getElementById('folderSaveStatus').innerHTML = banner('success','check-circle','Saved.');
  });

  document.getElementById('btnExport').addEventListener('click', async ()=>{
    const bundle = { accounts: readAccounts(), settings: state.settings, venues:{} };
    for (const acc of bundle.accounts){
      bundle.venues[acc.id] = readVenues(acc.id);
    }
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hermetic-cs-data.json'; a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btnImportTrigger').addEventListener('click', ()=> document.getElementById('importFile').click());

  /* Import merges rather than replaces. It runs against a Sheet the rest of the
     team is using, so wiping and rewriting would delete their work; every row
     goes through the same field-level merge an ordinary edit does, and a record
     the backup does not mention is left alone. */
  document.getElementById('importFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('importStatus');
    try{
      const text = await file.text();
      const bundle = JSON.parse(text);
      if (!confirm('Merge this backup into the shared Sheet? Existing answers are kept unless the backup has a newer version of the same field.')) {
        e.target.value = '';
        return;
      }
      statusEl.innerHTML = banner('info','loader-2','Merging…', true);

      const importRecord = (key, incoming) => {
        const kind = kindOfKey(key);
        const local = localRead(key);
        const merged = local ? mergeRecords(kind, local, incoming) : incoming;
        merged.rev = (local && local.rev) || 0;
        saveRecord(key, merged);
      };

      for (const acc of (bundle.accounts || [])){
        if (!acc || !acc.id) continue;
        const at = acc.updatedAt || acc.createdAt || Date.now();
        const rec = blankRecord({
          id: acc.id, name: acc.name || 'Untitled', drive_link: acc.drive_link || '',
          deleted: !!acc.deleted, createdAt: acc.createdAt || at
        });
        ['name','drive_link','deleted'].forEach(f => stampField(rec, f, (acc.fieldTs && acc.fieldTs[f]) || at));
        importRecord(accountKey(acc.id), rec);
      }

      for (const accId of Object.keys(bundle.venues || {})){
        for (const v of (bundle.venues[accId] || [])){
          if (!v || !v.id) continue;
          const at = v.lastEditedAt || v.updatedAt || Date.now();
          const data = v.data || newVenueData();
          foldLegacyBlocks(data);
          const rec = blankRecord({
            id: v.id, accountId: accId, name: v.name || 'Untitled', deleted: !!v.deleted,
            createdAt: v.createdAt || at, lastEditedAt: at, lastCopiedAt: v.lastCopiedAt || 0,
            data, docsRemoved: v.docsRemoved || []
          });
          ['name','deleted'].forEach(f => stampField(rec, f, (v.fieldTs && v.fieldTs[f]) || at));
          Object.keys(data).forEach(k => {
            if (k === 'docs') return;
            const path = 'data.' + k;
            stampField(rec, path, (v.fieldTs && v.fieldTs[path]) || at);
          });
          importRecord(venueKey(accId, v.id), rec);
        }
      }

      if (bundle.settings) saveSettings({
        rootFolderName: bundle.settings.rootFolderName || DEFAULT_SETTINGS.rootFolderName,
        rootFolderId: bundle.settings.rootFolderId || ''
      });

      statusEl.innerHTML = banner('info','loader-2','Merged. Saving to the Sheet…', true);
      await flushWrites();
      statusEl.innerHTML = banner('success','check-circle','Imported. Reloading…');
      location.reload();
    }catch(err){
      statusEl.innerHTML = banner('destructive','alert-triangle','Import failed: ' + err.message);
    }
  });
}

init();
</script>
